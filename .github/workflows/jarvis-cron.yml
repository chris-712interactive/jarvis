name: Jarvis cron tick

# Pings the deployed Jarvis /api/cron/tick on a schedule.
# Keep the Railway web service always-on (do NOT put Cron Schedule on that service).

on:
  schedule:
    # Every 10 minutes (UTC). GitHub can delay scheduled jobs under load.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force_briefing:
        description: "Pass forceBriefing=1"
        type: boolean
        default: false
      skip_watchdog:
        description: "Pass skipWatchdog=1"
        type: boolean
        default: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/tick
        env:
          JARVIS_URL: ${{ secrets.JARVIS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE_BRIEFING: ${{ inputs.force_briefing }}
          SKIP_WATCHDOG: ${{ inputs.skip_watchdog }}
        run: |
          set -euo pipefail

          if [ -z "${JARVIS_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing secrets. Add JARVIS_URL and CRON_SECRET in repo Settings → Secrets."
            exit 1
          fi

          BASE="${JARVIS_URL%/}"
          QS=()
          if [ "${FORCE_BRIEFING:-false}" = "true" ]; then
            QS+=("forceBriefing=1")
          fi
          if [ "${SKIP_WATCHDOG:-false}" = "true" ]; then
            QS+=("skipWatchdog=1")
          fi

          URL="${BASE}/api/cron/tick"
          if [ ${#QS[@]} -gt 0 ]; then
            URL="${URL}?$(IFS='&'; echo "${QS[*]}")"
          fi

          echo "POST ${URL}"
          set +e
          HTTP_CODE=$(curl -sS -o /tmp/jarvis-tick.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            --max-time 120 \
            "${URL}")
          CURL_EXIT=$?
          set -e

          echo "HTTP ${HTTP_CODE} (curl exit ${CURL_EXIT})"
          echo "Response body:"
          cat /tmp/jarvis-tick.json || true
          echo

          if [ "${CURL_EXIT}" -ne 0 ]; then
            echo "curl failed"
            exit 1
          fi

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "Tick returned non-2xx"
            exit 1
          fi

          python3 - <<'PY'
          import json, sys
          raw = open("/tmp/jarvis-tick.json").read().strip()
          if not raw:
              print("Empty response body")
              sys.exit(1)
          data = json.loads(raw)
          errors = data.get("errors") or []
          if errors:
              print("Tick completed with step errors:")
              for err in errors:
                  print(f" - {err}")
              # Still succeed HTTP-wise; surface for logs. Fail the job so we notice.
              sys.exit(1)
          if data.get("ok") is False and not errors:
              print("Unexpected response:", data)
              sys.exit(1)
          print("tick ok")
          PY
